name: Supabase keep-alive

# Free Supabase projects pause after 7 days without activity.
on:
  schedule:
    - cron: '0 12 */4 * *' # every 4 days at 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Supabase REST API
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/temporadas?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
